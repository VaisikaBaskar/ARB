<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Recipes - AI Recipe Box</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <script src="/static/js/nav.js" defer></script>
    <style>
        .discover-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recipe-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .seasonal-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff9800;
            /* Orange */
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .match-bar-container {
            background-color: #e9ecef;
            border-radius: 4px;
            height: 8px;
            margin: 10px 0;
            overflow: hidden;
        }

        .match-bar {
            background-color: #28a745;
            height: 100%;
        }

        .missing-list {
            margin-top: 10px;
            padding-left: 20px;
            font-size: 0.9em;
            color: #d9534f;
            display: none;
            /* Collapsed by default */
        }

        .toggle-missing {
            background: none;
            border: none;
            color: #007bff;
            padding: 0;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: underline;
        }

        .source-tag {
            font-size: 0.75em;
            color: #777;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>

<body>
    <!-- Legacy Nav Removed -->
    <div class="container">
        <h1>Discover Recipes</h1>
        <p class="section-hint">Explore recipes from external sources, tailored to the season and your pantry.</p>

        <div style="text-align: center; margin-bottom: 20px;">
            <!-- ID inferred -->
            <h3 id="seasonInfo" style="color:#d35400;"></h3>
            <button id="discoverBtn">Find New Recipes</button>
        </div>

        <div id="resultsGrid" class="discover-grid"></div>
    </div>

    <!-- Authentication -->
    <script src="js/auth.js"></script>
    <script>
        checkAuth(true).then(userId => {
            if (userId && window.discoverRecipes) {
                window.discoverRecipes(userId);
            }
        }); 
    </script>
    <script src="js/discover.js"></script>
</body>

</html>
